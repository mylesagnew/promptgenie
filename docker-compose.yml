name: promptgenie

# Local development stack for the promptgenie_service API.
#
# `postgres`, `redis`, and `minio` are not wired into the API yet — the
# Phase 1 endpoints (/v1/generate, /v1/lint) call promptgenie.core directly
# with no external state. They're started here so Phase 2 (externalized run
# history / object storage) has a local target to develop against without
# reshaping this file later.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: promptgenie-api:local
    command:
      - python
      - -m
      - uvicorn
      - promptgenie_service.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --reload
    ports:
      - "8080:8080"
    environment:
      PROMPTGENIE_ENV: development
      PROMPTGENIE_LOG_LEVEL: debug
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promptgenie
      POSTGRES_USER: promptgenie
      POSTGRES_PASSWORD: promptgenie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptgenie -d promptgenie"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/promptgenie-artifacts &&
      mc anonymous set none local/promptgenie-artifacts
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
