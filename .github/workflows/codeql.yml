name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"  # weekly on Monday at 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze-python:
    name: Analyze (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python
          queries: security-and-quality
          config: |
            paths:
              - promptgenie/
            paths-ignore:
              - tests/

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:python"

  analyze-javascript:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript
          queries: security-and-quality
          config: |
            paths:
              - vscode-extension/
            paths-ignore:
              - "**/*.test.ts"
              - "**/node_modules/**"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript"
