version: 2

# Grouping keeps lockfile bumps in one PR per ecosystem (separate PRs kept
# conflicting on uv.lock / package-lock.json) and keeps action families that
# must share a version (e.g. codeql-action init/analyze/upload-sarif) together.
# Majors stay as individual PRs so breaking changes are reviewed one at a time.

updates:
  # Python dependencies (uv lockfile)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "bandit"
          - "pip-audit"
          - "mypy"
          - "types-*"
          - "build"
          - "twine"
          - "cyclonedx-bom"
          - "respx"
          - "setuptools"
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # npm (VS Code extension)
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint 8.x peers typescript <6.1, so newer TS breaks npm ci; raise
      # this bound when typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        versions: [">=6.1"]
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
